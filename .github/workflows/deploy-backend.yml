name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build jar
        working-directory: backend
        run: ./gradlew bootJar -x test

      - name: Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          JAR=$(ls backend/build/libs/*.jar | head -n 1)

          scp -i ~/.ssh/deploy_key "$JAR" "$EC2_USER@$EC2_HOST:/home/ec2-user/incheonguro-backend/app.jar.new"

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" '
            set -e
            cp /home/ec2-user/incheonguro-backend/app.jar /home/ec2-user/incheonguro-backend/backups/app.jar.$(date +%Y%m%d-%H%M%S)
            mv /home/ec2-user/incheonguro-backend/app.jar.new /home/ec2-user/incheonguro-backend/app.jar
            sudo systemctl restart incheonguro.service
            sleep 5
            curl -sf http://localhost:8080/api/region > /dev/null
          '
