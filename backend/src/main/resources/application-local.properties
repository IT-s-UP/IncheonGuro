# Isolated, persistent development DB; production PostgreSQL settings remain in application.properties.
spring.datasource.url=jdbc:h2:file:./data/social-login;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
server.address=127.0.0.1
