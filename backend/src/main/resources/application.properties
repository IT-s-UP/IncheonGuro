spring.application.name=incheonguro

spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.error.include-message=always

spring.web.resources.cache.period=0

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

kakao.auth.client-id=${KAKAO_REST_API_KEY:}
kakao.auth.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.auth.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:5173/api/auth/kakao/callback}
kakao.auth.frontend-url=${AUTH_FRONTEND_URL:http://localhost:5173}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

google.auth.client-id=${GOOGLE_CLIENT_ID:}
google.auth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.auth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/api/auth/google/callback}
google.auth.frontend-url=${AUTH_FRONTEND_URL:http://localhost:5173}

jwt.secret=${JWT_SECRET:}

kto.service-key=${KTOUR_SERVICE_KEY}
kakao.rest-api-key=${KAKAO_REST_API_KEY}

app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME:}
